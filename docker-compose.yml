version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: smart_attendance_mysql
    restart: always
    environment:
      MYSQL_DATABASE: attendance_db
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: attendance_user
      MYSQL_PASSWORD: app_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/db/migration/V1__init_schema.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./backend/src/main/resources/db/migration/V2__sample_data.sql:/docker-entrypoint-initdb.d/02_sample.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  spring-boot-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart_attendance_backend
    restart: on-failure
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/attendance_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    ports:
      - "8080:8080"

  react-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart_attendance_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - spring-boot-backend

volumes:
  mysql_data:
